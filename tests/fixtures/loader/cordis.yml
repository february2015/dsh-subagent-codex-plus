# Test-only composition of the fork (dsh-subagent-codex-plus): base services, two
# named Codex instances, and the tool rows. The owning e2e applies the package's
# real Bundle patch (which inserts the default `codex-plus` instance) and never
# invokes the model or Codex.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: fixture
  name: './fixture.mjs'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: subagent-codex-primary
  name: 'dsh-subagent-codex-plus'
  config:
    providerName: codex-primary
    model: codex-primary-model

- id: subagent-codex-secondary
  name: 'dsh-subagent-codex-plus'
  config:
    providerName: codex-secondary
    model: codex-secondary-model

- id: tool-subagent-codex
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: codex-plus
    toolName: subagent_codex
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-codex-primary
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: codex-primary
    toolName: subagent_codex_primary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-codex-secondary
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: codex-secondary
    toolName: subagent_codex_secondary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'